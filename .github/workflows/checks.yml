name: Checks
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: Validate both roots without backend or cloud credentials
        shell: bash
        run: |
          set -euo pipefail
          for root in infra/bootstrap infra/site; do
            TF_DATA_DIR="$(mktemp -d)"
            export TF_DATA_DIR
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
            terraform -chdir="$root" test -no-color
            rm -rf "$TF_DATA_DIR"
          done
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: node scripts/check-workflows.mjs
      - run: bash scripts/lint-workflows.sh
